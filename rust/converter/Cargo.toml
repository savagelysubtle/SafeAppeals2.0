[package]
name = "sa-converter"
version = "0.1.0"
edition = "2021"
authors = ["Safe Appeals"]
license = "Proprietary"
description = "SafeAppeals file converter sidecar (NDJSON protocol)"

[[bin]]
name = "sa-converter"
path = "src/main.rs"

[lib]
name = "sa_converter"
path = "src/lib.rs"

[features]
default = []
libreoffice = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
comrak = "0.33"
ammonia = "4"
docx-rs = "0.4"
calamine = "0.26"
rust_xlsxwriter = "0.79"
csv = "1"
image = "0.24"
printpdf = { version = "0.7", features = ["embedded_images"] }
lopdf = "0.34"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
html-escape = "0.2"
encoding_rs = "0.8"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
