[package]
name = "docparse"
version = "0.1.0"
edition = "2021"
authors = ["Safe Appeals"]
license = "Proprietary"
description = "SafeAppeals DocParse HTTP sidecar for Unlimited-OCR"

[[bin]]
name = "sa-docparse"
path = "src/main.rs"

[lib]
name = "docparse"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
lopdf = "0.34"
pdf-extract = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
