name: Build SafeAppeals Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.5.0)'
        required: true

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # ============================================
  # Pre-build: WASM artifacts (platform-agnostic)
  # ============================================
  build-wasm-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/vs/workbench/contrib/void/browser/documentViewers/xlsxRustViewer/wasm/target
            src/vs/workbench/contrib/void/browser/documentViewers/pdfViewer/wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108

      - name: Setup Node.js (for esbuild)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JS build dependencies
        run: |
          npm install -g esbuild chart.js
          mkdir -p node_modules
          ln -s "$(npm root -g)/esbuild" node_modules/esbuild
          ln -s "$(npm root -g)/chart.js" node_modules/chart.js

      - name: Build XLSX Rust Viewer WASM
        run: wasm-pack build --target web --out-dir ../media/wasm --no-typescript
        working-directory: src/vs/workbench/contrib/void/browser/documentViewers/xlsxRustViewer/wasm

      - name: Build XLSX Viewer JS bundle
        run: node build.mjs
        working-directory: src/vs/workbench/contrib/void/browser/documentViewers/xlsxRustViewer/media

      - name: Build PDF Viewer WASM
        working-directory: src/vs/workbench/contrib/void/browser/documentViewers/pdfViewer/wasm
        run: |
          cargo build --target wasm32-unknown-unknown --release
          mkdir -p pkg
          wasm-bindgen \
            --target web \
            --out-dir pkg/ \
            target/wasm32-unknown-unknown/release/pdf_viewer.wasm
          mkdir -p ../media/wasm
          cp pkg/pdf_viewer_bg.wasm ../media/wasm/
          cp pkg/pdf_viewer.js ../media/wasm/
          if [ -f pkg/pdf_viewer.d.ts ]; then
            cp pkg/pdf_viewer.d.ts ../media/wasm/
          fi

      - name: Build PDF Viewer JS bundle
        run: node build.mjs
        working-directory: src/vs/workbench/contrib/void/browser/documentViewers/pdfViewer/media

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          retention-days: 1
          path: |
            src/vs/workbench/contrib/void/browser/documentViewers/xlsxRustViewer/media/wasm/
            src/vs/workbench/contrib/void/browser/documentViewers/xlsxRustViewer/media/xlsxRustViewer.js
            src/vs/workbench/contrib/void/browser/documentViewers/pdfViewer/media/wasm/

  # ============================================
  # Windows x64 Build
  # ============================================
  build-windows:
    needs: build-wasm-artifacts
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --force
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run postinstall and rebuild native modules
        run: |
          node build/npm/postinstall.js
          node build/npm/rebuild-native.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch built-in extensions
        run: node -e "require('./build/lib/builtInExtensions').getBuiltInExtensions()"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Setup Python venv
        run: npm run gulp setup-python

      - name: Stamp commit SHA into product.json
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.commit=process.env.COMMIT_SHA;fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')"

      - name: Compile TypeScript (CI mode)
        run: npm run compile-build-ci

      - name: Compile extensions
        run: npm run compile-extensions-build

      - name: Bundle VS Code
        run: npm run gulp bundle-vscode

      - name: Package Windows x64
        run: npm run gulp vscode-win32-x64-ci

      - name: Add Inno Updater
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Download OCR tools (Tesseract + Poppler)
        shell: pwsh
        run: |
          & build\win32\tools\download-tesseract.ps1
          & build\win32\tools\download-poppler.ps1

      - name: Create Windows Installer
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "${{ github.event.inputs.version }}" }
          if ($version -eq "") { $version = "v0.0.0" }
          $version = $version -replace "^v", ""
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $setupDir = ".build/win32-x64/user-setup"
          $exe = Get-ChildItem "$setupDir/*.exe" | Select-Object -First 1
          if ($exe) {
            Move-Item $exe.FullName "$setupDir/SafeAppealsNavigator-$version-win32-x64-user-setup.exe"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: SafeAppeals-Windows-x64-Installer
          path: .build/win32-x64/user-setup/*.exe
          retention-days: 30

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Compress-Archive -Path "../VSCode-win32-x64/*" -DestinationPath "SafeAppealsNavigator-$version-win32-x64-portable.zip"

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: SafeAppeals-Windows-x64-Portable
          path: SafeAppealsNavigator-*-win32-x64-portable.zip
          retention-days: 30

  # ============================================
  # macOS ARM64 (Apple Silicon) Build
  # ============================================
  build-macos-arm64:
    needs: build-wasm-artifacts
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-arm64-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-arm64-node-

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix broken @electron/node-gyp
        run: |
          npm install -g node-gyp
          rm -f node_modules/.bin/node-gyp
          ln -s "$(which node-gyp)" node_modules/.bin/node-gyp

      - name: Run postinstall and rebuild native modules
        run: |
          node build/npm/postinstall.js
          node build/npm/rebuild-native.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch built-in extensions
        run: node -e "require('./build/lib/builtInExtensions').getBuiltInExtensions()"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Setup Python venv
        run: npm run gulp setup-python

      - name: Stamp commit SHA into product.json
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.commit=process.env.COMMIT_SHA;fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')"

      - name: Compile TypeScript (CI mode)
        run: npm run compile-build-ci

      - name: Compile extensions
        run: npm run compile-extensions-build

      - name: Bundle VS Code
        run: npm run gulp bundle-vscode

      - name: Package macOS ARM64
        run: npm run gulp vscode-darwin-arm64-ci

      - name: Get version from tag
        id: get_version
        run: |
          version="${{ github.ref_name }}"
          if [ -z "$version" ]; then version="${{ github.event.inputs.version }}"; fi
          if [ -z "$version" ]; then version="v0.0.0"; fi
          version="${version#v}"
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Create macOS ARM64 ZIP
        run: |
          version="${{ steps.get_version.outputs.VERSION }}"
          cd ..
          zip -r -y "$GITHUB_WORKSPACE/SafeAppealsNavigator-$version-darwin-arm64.zip" VSCode-darwin-arm64

      - name: Upload macOS ARM64 Build
        uses: actions/upload-artifact@v4
        with:
          name: SafeAppeals-macOS-arm64
          path: SafeAppealsNavigator-*-darwin-arm64.zip
          retention-days: 30

  # ============================================
  # Linux x64 Build
  # ============================================
  build-linux:
    needs: build-wasm-artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile-dev \
            pkg-config \
            libsecret-1-dev \
            libkrb5-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            fakeroot \
            rpm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix broken @electron/node-gyp
        run: |
          npm install -g node-gyp
          rm -f node_modules/.bin/node-gyp
          ln -s "$(which node-gyp)" node_modules/.bin/node-gyp

      - name: Run postinstall and rebuild native modules
        run: |
          node build/npm/postinstall.js
          node build/npm/rebuild-native.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch built-in extensions
        run: node -e "require('./build/lib/builtInExtensions').getBuiltInExtensions()"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Setup Python venv
        run: npm run gulp setup-python

      - name: Stamp commit SHA into product.json
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.commit=process.env.COMMIT_SHA;fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')"

      - name: Compile TypeScript (CI mode)
        run: npm run compile-build-ci

      - name: Compile extensions
        run: npm run compile-extensions-build

      - name: Bundle VS Code
        run: npm run gulp bundle-vscode

      - name: Package Linux x64
        run: npm run gulp vscode-linux-x64-ci

      - name: Get version from tag
        id: get_version
        run: |
          version="${{ github.ref_name }}"
          if [ -z "$version" ]; then version="${{ github.event.inputs.version }}"; fi
          if [ -z "$version" ]; then version="v0.0.0"; fi
          version="${version#v}"
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Create Linux tarball
        run: |
          version="${{ steps.get_version.outputs.VERSION }}"
          cd ..
          tar -czvf "$GITHUB_WORKSPACE/SafeAppealsNavigator-$version-linux-x64.tar.gz" VSCode-linux-x64

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: SafeAppeals-Linux-x64
          path: SafeAppealsNavigator-*-linux-x64.tar.gz
          retention-days: 30

  # ============================================
  # Create GitHub Release with all assets
  # ============================================
  create-release:
    needs: [build-windows, build-macos-arm64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Get version
        id: get_version
        run: |
          version="${{ github.ref_name }}"
          if [ -z "$version" ]; then version="${{ github.event.inputs.version }}"; fi
          if [ -z "$version" ]; then version="v0.0.0"; fi
          version="${version#v}"
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find ./artifacts -name "*.exe" -exec cp {} release-assets/ \;
          find ./artifacts -name "*.zip" -exec cp {} release-assets/ \;
          find ./artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets/

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: Safe Appeals Navigator v${{ steps.get_version.outputs.VERSION }}
          body_path: ''
          body: |
            ## Safe Appeals Navigator v${{ steps.get_version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/savagelysubtle/SafeAppeals2.0/blob/main/CHANGELOG.md) for detailed release notes.

            ### Highlights

            - **XLSX Viewer**: Complete Rust/WASM rewrite with charts, formulas, data validation, and AI table tools
            - **PDF Viewer**: Complete Rust/WASM rewrite with annotations, AI integration, and native export
            - **Integrated Browser**: Full in-app web browsing with navigation controls
            - **RAG v2.1**: Overhauled vector search pipeline, micro database architecture, hybrid search with cross-encoder reranking
            - **Audio Transcription**: Whisper-powered speech-to-text with FFmpeg integration
            - **Case Timeline**: Event tracker with document linking, calendar view, and PDF export
            - **DOCX Viewer**: MS Word-like features, pagination, ribbon interface, and auto-save
            - **File Conversion**: Multi-format document conversion with Python/Docling backend
            - **OCR Support**: Bundled Tesseract and Poppler for image text extraction
            - **Cloud Services**: SafeAppeals Cloud backend, LLM routing, Brave Search Pro integration

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | **Windows** | `SafeAppealsNavigator-${{ steps.get_version.outputs.VERSION }}-win32-x64-user-setup.exe` | Installer (recommended) |
            | **Windows** | `SafeAppealsNavigator-${{ steps.get_version.outputs.VERSION }}-win32-x64-portable.zip` | Portable version |
            | **macOS** | `SafeAppealsNavigator-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.zip` | For Apple Silicon (M1/M2/M3/M4) Macs |
            | **Linux** | `SafeAppealsNavigator-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz` | Linux x64 |

            ### System Requirements
            - **Windows**: Windows 10 or later (64-bit)
            - **macOS**: macOS 10.15 or later
            - **Linux**: Ubuntu 18.04+, Fedora 32+, or equivalent

            ### Installation
            - **Windows**: Run the `.exe` installer (no admin required for user setup)
            - **macOS**: Extract the `.zip` and drag to Applications
            - **Linux**: Extract the `.tar.gz` and run `./safe-appeals-navigator`

            ### Integrity
            Verify downloads with the `SHA256SUMS.txt` file included in this release.

          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
