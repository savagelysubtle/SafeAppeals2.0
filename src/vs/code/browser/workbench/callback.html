<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

		<!-- Hardcoded product name — do not rely on server-side placeholder injection. -->
		<title>Safe Appeals</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

		<!-- Scripts -->
		<script>

			function decode(value) {
				return value === null ? null : decodeURIComponent(value);
			}

			const url = new URL(window.location.href);
			const params = url.searchParams;
			const id = decode(params.get('vscode-reqid'));
			const scheme = decode(params.get('vscode-scheme'));
			const authority = decode(params.get('vscode-authority'));

			if (!id) {
				throw new Error('Missing id');
			} else if (!scheme) {
				throw new Error('Missing scheme');
			} else if (!authority) {
				throw new Error('Missing authority');
			}

			const path = decode(params.get('vscode-path'));
			const query = decode(params.get('vscode-query'));
			const fragment = decode(params.get('vscode-fragment'));

			params.delete('vscode-reqid');
			params.delete('vscode-scheme');
			params.delete('vscode-authority');
			params.delete('vscode-path');
			params.delete('vscode-query');
			params.delete('vscode-fragment');

			let uri = { scheme, authority };

			if (path) {
				uri.path = path;
			}

			if (query) {
				const originalParams = new URLSearchParams(query);
				originalParams.forEach((value, key) => params.set(key, value));
			}

			const resultQuery = params.toString();
			if (resultQuery) {
				uri.query = resultQuery;
			}

			if (fragment) {
				uri.fragment = fragment;
			}

			localStorage.setItem(`vscode-web.url-callbacks[${id}]`, JSON.stringify(uri));

			// Durable OAuth recovery across workbench reload (SafeAppeals fork).
			// LocalStorageURLCallbackProvider only watches ids registered in the *current*
			// session; after reload those keys sit unused. Persist the reconstructed URI
			// so the next workbench boot can open it via recoverOrphanedCallbacks().
			// Only SafeAppeals Cloud OAuth — never GitHub / other provider callbacks.
			const oauthCode = params.get('code');
			const oauthState = params.get('state');
			const oauthError = params.get('error');
			const isSafeAppealsCloudOAuth = authority === 'safeappeals.safeappeals-authentication'
				&& path === '/auth/callback';
			if (isSafeAppealsCloudOAuth && oauthState && (oauthCode || oauthError)) {
				localStorage.setItem('safeappeals-cloud.oauthCallback', JSON.stringify({
					...uri,
					ts: Date.now()
				}));
			}
		</script>

		<!-- Styling — Safe Appeals dashboard / auth-finish palette -->
		<style type="text/css">
			html {
				height: 100%;
			}

			body {
				box-sizing: border-box;
				min-height: 100%;
				margin: 0;
				padding: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #ffffff;
				font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background:
					radial-gradient(ellipse at 20% 30%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
					radial-gradient(ellipse at 80% 70%, rgba(52, 211, 153, 0.06) 0%, transparent 50%),
					linear-gradient(135deg, #0a0f0d, #050a08);
				position: relative;
				overflow: hidden;
			}

			.glow {
				position: absolute;
				top: 33%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 400px;
				height: 400px;
				background: rgba(16, 185, 129, 0.1);
				border-radius: 50%;
				filter: blur(100px);
				pointer-events: none;
			}

			.composition {
				position: relative;
				z-index: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
				padding: 48px 32px;
				max-width: 28rem;
			}

			.brand {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				margin-bottom: 2.5rem;
				text-decoration: none;
				color: #ffffff;
			}

			.brand-logo {
				width: 44px;
				height: 44px;
				border-radius: 10px;
				box-shadow: 0 8px 24px rgba(5, 150, 105, 0.25);
				display: block;
			}

			.brand-name {
				font-size: 1.5rem;
				font-weight: 700;
				letter-spacing: -0.02em;
				color: #ffffff;
			}

			.headline {
				margin: 0 0 0.5rem;
				font-size: 1.75rem;
				font-weight: 700;
				letter-spacing: -0.02em;
				color: #ffffff;
			}

			.message {
				margin: 0;
				font-size: 1.05rem;
				font-weight: 400;
				line-height: 1.5;
				color: #9ca3af;
			}

			.hint {
				margin: 1.25rem 0 0;
				font-size: 0.875rem;
				font-weight: 400;
				color: #6b7280;
			}
		</style>
	</head>
	<body>
		<div class="glow" aria-hidden="true"></div>
		<main class="composition">
			<div class="brand">
				<img class="brand-logo" src="static/resources/server/safe-appeals-icon.png" alt="" width="44" height="44" />
				<span class="brand-name">Safe Appeals</span>
			</div>
			<h1 class="headline">You're signed in</h1>
			<p class="message">You can close this page now.</p>
			<p class="hint">Return to Safe Appeals to continue.</p>
		</main>
	</body>
</html>
