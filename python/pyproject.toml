[project]
name = "transmutation-codex"
version = "1.0.0"
description = "AiChemist File Converter - Document conversion engine for SafeAppeals"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "pypandoc>=1.13",
    "PyPDF2>=3.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",

    # Document formats
    "openpyxl>=3.1.0",
    "ebooklib>=0.18",
    "markdown>=3.5",
    "markdown-pdf>=1.0",
    "pdfkit>=1.0.0",

    # Image processing (required for pdf2images and OCR)
    "Pillow>=10.0.0",
    "pdf2image>=1.16.0",

    # OCR support (requires tesseract system dependency)
    "pytesseract>=0.3.10",
    "ocrmypdf>=16.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["transmutation_codex*"]

